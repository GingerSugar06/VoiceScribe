<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F43F7E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3D9FF"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#3A0A52" flood-opacity="0.5"/>
    </filter>
    <clipPath id="sq"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <!-- ses dalgaları -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M232 400 C196 466 196 558 232 624" stroke-width="30" stroke-opacity="0.85"/>
      <path d="M150 340 C88 450 88 574 150 684" stroke-width="26" stroke-opacity="0.5"/>
      <path d="M792 400 C828 466 828 558 792 624" stroke-width="30" stroke-opacity="0.85"/>
      <path d="M874 340 C936 450 936 574 874 684" stroke-width="26" stroke-opacity="0.5"/>
    </g>
    <!-- mikrofon -->
    <g filter="url(#sh)">
      <rect x="388" y="170" width="248" height="400" rx="124" fill="url(#mic)"/>
      <path d="M298 470 C298 612 392 690 512 690 C632 690 726 612 726 470" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
      <rect x="490" y="690" width="44" height="96" rx="12" fill="#FFFFFF"/>
      <rect x="400" y="776" width="224" height="46" rx="23" fill="#FFFFFF"/>
    </g>
    <!-- ızgara -->
    <g stroke="#C026D3" stroke-opacity="0.28" stroke-width="12" stroke-linecap="round">
      <line x1="430" y1="262" x2="594" y2="262"/><line x1="420" y1="330" x2="604" y2="330"/><line x1="420" y1="398" x2="604" y2="398"/><line x1="430" y1="466" x2="594" y2="466"/>
    </g>
    <!-- yazı satırları (metne dönüşüm) -->
    <g fill="#FFFFFF">
      <rect x="352" y="880" width="320" height="22" rx="11" opacity="0.95"/>
      <rect x="402" y="920" width="220" height="16" rx="8" opacity="0.7"/>
    </g>
  </g>
  <rect width="1024" height="1024" rx="232" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>
</svg>
